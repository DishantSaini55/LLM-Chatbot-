# Proposed deployment. Applying this Blueprint creates a PAID backend + disk.
# Review the plan and charges before applying it in your own Render account.
services:
  - type: web
    name: dishantsaini55-lyftr-api
    runtime: docker
    repo: https://github.com/DishantSaini55/LLM-Chatbot-
    branch: main
    region: singapore
    plan: 0.5c-512mb
    numInstances: 1
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    disk:
      name: lyftr-sqlite
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: LLM_API_KEYS
        sync: false
      - key: LLM_MODEL
        value: gemini/gemini-3.1-flash-lite
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: ALLOWED_ORIGINS
        value: https://dishantsaini55-lyftr-web.onrender.com
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: LITELLM_CACHE_TYPE
        value: local
      - key: DEFAULT_SYSTEM_PROMPT
        value: You are a helpful, concise assistant.
      - key: PORT
        value: "8000"
      - key: PUBLIC_API_URL
        fromService:
          type: web
          name: dishantsaini55-lyftr-api
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: dishantsaini55-lyftr-web
    runtime: static
    repo: https://github.com/DishantSaini55/LLM-Chatbot-
    branch: main
    rootDir: frontend
    buildCommand: npm ci && node scripts/build-cloud.mjs
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: dishantsaini55-lyftr-api
          envVarKey: PUBLIC_API_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

[project]
name = "lyftr-chat-backend"
version = "0.1.0"
description = "FastAPI service for the Lyftr LLM chatbot assignment"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "litellm>=1.63,<2",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.0,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
